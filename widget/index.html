<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sitio de prueba — anfitrión del widget</title>
    <style>
      body {
        margin: 0;
        padding: 3rem 1.5rem;
        font-family: Georgia, 'Times New Roman', serif;
        line-height: 1.7;
        color: #2b2b2b;
        background: #faf7f2;
      }
      .contenido {
        max-width: 38rem;
        margin: 0 auto;
      }
      h1 {
        font-size: 2.25rem;
      }
    </style>
  </head>
  <body>
    <!-- Pagina deliberadamente distinta al panel: sirve para ver si el widget respeta o rompe el estilo ajeno. -->
    <div class="contenido">
      <h1>Tienda de ejemplo</h1>
      <p>
        Esta página simula el sitio de un cliente. El widget se monta solo, sin
        que esta página escriba nada de HTML para él.
      </p>
      <p>
        En el bloque 5 el widget pasará a Shadow DOM para quedar aislado de estos
        estilos.
      </p>
    </div>
    <script type="module" src="/src/main.jsx" data-vera-key="pk_demo_local"></script>
  </body>
</html>
