spring.application.name=vera
server.port=8090

# Claves de API fuera de git, igual que en futbot. Opcional: la app arranca sin el archivo.
spring.config.import=optional:classpath:application-local.properties

# Credenciales por variable de entorno con valores de desarrollo por defecto.
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:vera}
spring.datasource.username=${DB_USER:vera}
spring.datasource.password=${DB_PASSWORD:vera_dev}

# Flyway es el unico dueno del esquema; Hibernate solo valida contra el.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# En produccion el secreto llega por variable de entorno; el de desarrollo no sirve para nada real.
vera.jwt.secreto=${JWT_SECRETO:desarrollo-secreto-local-de-al-menos-32-bytes-no-usar-en-produccion}
vera.jwt.minutos-acceso=30
vera.jwt.dias-refresco=7

vera.cors.origenes=${CORS_ORIGENES:http://localhost:5177,http://localhost:5178}

# Techo de subida por archivo; un PDF de catalogo rara vez pasa de aqui.
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
