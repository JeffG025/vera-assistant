name: CI

on:
  push:
    branches: [main]
  pull_request:
  # El examen con el modelo real se pide a mano o corre solo los lunes: gasta cuota de la API.
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * 1'

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest

    # Postgres real con pgvector: las migraciones y las pruebas corren contra lo mismo que en local.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: vera
          POSTGRES_USER: vera
          POSTGRES_PASSWORD: vera_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vera -d vera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar y probar
        working-directory: backend
        run: ./mvnw -B verify

  examen:
    name: Examen de calidad (modelo real)
    # Fuera de los push: cada corrida consume cuota de Gemini y tarda un par de minutos.
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: vera
          POSTGRES_USER: vera
          POSTGRES_PASSWORD: vera_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vera -d vera"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    steps:
      # Sin la clave de Gemini el examen se salta con un aviso en vez de marcar la corrida en rojo.
      - name: Comprobar la clave de Gemini
        id: clave
        env:
          CLAVE: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$CLAVE" ]; then
            echo "::notice::Falta el secreto GEMINI_API_KEY: se salta el examen con el modelo real."
            echo "hay=no" >> "$GITHUB_OUTPUT"
          else
            echo "hay=si" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.clave.outputs.hay == 'si'
      - uses: actions/setup-java@v5
        if: steps.clave.outputs.hay == 'si'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Correr el conjunto esencial contra el modelo real
        if: steps.clave.outputs.hay == 'si'
        working-directory: backend
        env:
          VERA_EXAMEN_REAL: '1'
          # SPRING_APPLICATION_JSON es la via sin ambiguedad para meter una propiedad con guion
          # desde el entorno; sin el secreto la prueba falla diciendo que no midio nada.
          SPRING_APPLICATION_JSON: '{"vera.gemini.api-key":"${{ secrets.GEMINI_API_KEY }}"}'
        run: ./mvnw -B test -Dtest=ExamenRealTest -DfailIfNoTests=false

  frontend:
    name: Frontend (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [admin, widget]

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - name: Instalar
        working-directory: ${{ matrix.app }}
        run: npm ci
      - name: Compilar
        working-directory: ${{ matrix.app }}
        run: npm run build
