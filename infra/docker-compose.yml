name: vera

services:
  db:
    image: pgvector/pgvector:pg17
    container_name: vera-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vera}
      POSTGRES_USER: ${POSTGRES_USER:-vera}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vera_dev}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vera-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vera} -d ${POSTGRES_DB:-vera}"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  vera-db-data:
